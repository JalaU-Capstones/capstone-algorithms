# CI pipeline for capstone-algorithms
# Triggers on every push and on PRs targeting main.
# Two sequential jobs: quality (lint + types) then test (DB + pytest).
name: CI — capstone-algorithms

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Code Quality
  # Runs ruff (lint + format) and mypy before any tests are executed.
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install project in editable mode
        run: uv pip install -e .

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Tests
  # Spins up a PostgreSQL 17 service, runs Alembic migrations, then pytest.
  # Only runs after the quality job passes successfully.
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: capstone_user
          POSTGRES_PASSWORD: capstone_pass
          POSTGRES_DB: capstone_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install project in editable mode
        run: uv pip install -e .

      - name: Create test database
        run: |
          # Wait for PostgreSQL to accept connections
          until PGPASSWORD=capstone_pass pg_isready -h localhost -p 5432 -U capstone_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          # Create the test database
          PGPASSWORD=capstone_pass psql -h localhost -p 5432 -U capstone_user \
            -c "CREATE DATABASE capstone_test_db;"
        env:
          PGPASSWORD: capstone_pass

      - name: Run database migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://capstone_user:capstone_pass@localhost:5432/capstone_db
          TEST_DATABASE_URL: postgresql://capstone_user:capstone_pass@localhost:5432/capstone_test_db

      - name: Run tests with coverage
        run: uv run pytest --cov=src/capstone --cov-report=term-missing --cov-report=xml
        env:
          DATABASE_URL: postgresql://capstone_user:capstone_pass@localhost:5432/capstone_db
          TEST_DATABASE_URL: postgresql://capstone_user:capstone_pass@localhost:5432/capstone_test_db

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
