[project]
name = "capstone-algorithms"
version = "0.1.0"
description = "Student Performance Analysis System — Algorithms 1 Capstone"
authors = [{name = "Diego Alejandro Botina Herrera"}]
requires-python = ">=3.14"
readme = "README.md"
license = {file = "LICENSE"}

dependencies = [
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capstone"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "sqlalchemy[mypy]"
]

[tool.ruff]
line-length = 88
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/capstone --cov-report=term-missing --cov-fail-under=70"
